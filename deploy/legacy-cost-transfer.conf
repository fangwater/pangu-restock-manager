# Included in the existing pangutech.online server. Other PNL routes are unchanged.
location = /inventory {
    return 302 /pangu-restock/?view=costs;
}
location = /inventory-templates {
    return 302 /pangu-restock/?view=cost-templates;
}
location ~ ^/api/inventory(?:$|/|-cost-) {
    default_type application/json;
    return 410 '{"detail":"成本管理已移交备货系统","url":"/pangu-restock/?view=costs"}';
}
